<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calc">
<h3>Calculator</h3>
<input id="display" readonly placeholder="0">
<div id="api">API: Waiting...</div>
<div class="btns">
<button class="c" onclick="clearD()">C</button>
<button onclick="del()">DEL</button>
<button class="o" onclick="add('/')">÷</button>
<button class="o" onclick="add('*')">×</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="o" onclick="add('-')">-</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="o" onclick="add('+')">+</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="eq" onclick="calc()">=</button>
<button class="z" onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
